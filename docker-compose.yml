services:
  postgres:
    image: postgres:15-alpine
    container_name: matchhire_postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-matchhire}
      POSTGRES_USER: ${DATABASE_USER:-matchhire_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-matchhire_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-matchhire_user} -d ${DATABASE_NAME:-matchhire}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: matchhire_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matchhire_celery_worker
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DATABASE_NAME=${DATABASE_NAME:-matchhire}
      - DATABASE_USER=${DATABASE_USER:-matchhire_user}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-matchhire_password}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
