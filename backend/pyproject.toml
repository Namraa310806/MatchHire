[project]
name = "backend"
version = "0.1.0"
description = "MatchHire Django backend"
authors = [
    { name = "Namraa Patel", email = "patelnamraa310806@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "django>=6.1.2",
    "django-celery-beat>=2.1.0",
    "django-extensions>=4.1",
    "djangorestframework>=3.18.3",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["config", "api"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]
